<!DOCTYPE html>
<html>
<head>
    <title>ADMIN_CONTROL_CENTER - SaaS Proxy</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0e0a;
            --bg-surface: #0f150f;
            --bg-elevated: #141b14;
            --border: #1c2b1c;
            --text-primary: #d6ffd6;
            --text-muted: #5f8f5f;
            --accent: #00ff66;
            --accent-dim: #00b34a;
            --danger: #ff2d55;
            --warning: #ffb000;
            --glow: 0 0 8px rgba(0,255,102,0.6);
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-base);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
            position: relative;
        }

        /* Scanline Overlay */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 1000;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 30px;
            position: relative;
            box-shadow: var(--glow);
        }

        h1 {
            font-family: 'Share Tech Mono', monospace;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 4px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-top: 0;
        }

        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 30px;
            box-shadow: var(--glow);
            text-align: center;
        }

        input {
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            padding: 12px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 20px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--accent);
        }

        .btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 20px;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: var(--accent);
            color: var(--bg-base);
            box-shadow: var(--glow);
        }

        .btn-status {
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-status:hover {
            background: var(--danger);
            color: var(--bg-base);
        }

        .btn-status.active {
            border-color: var(--warning);
            color: var(--warning);
        }

        .btn-status.active:hover {
            background: var(--warning);
            color: var(--bg-base);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th {
            background: var(--bg-elevated);
            color: var(--accent);
            text-align: left;
            padding: 15px;
            border: 1px solid var(--border);
            font-size: 12px;
            text-transform: uppercase;
        }

        td {
            padding: 15px;
            border: 1px solid var(--border);
            font-size: 13px;
        }

        tr:hover td {
            background: rgba(0, 255, 102, 0.05);
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .status-tag {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .status-active { color: var(--accent); border: 1px solid var(--accent); }
        .status-disabled { color: var(--danger); border: 1px solid var(--danger); }
    </style>
</head>
<body>
    <div id="loginSection" class="login-box">
        <h2 style="font-family: 'Share Tech Mono'; color: var(--accent);">ADMIN_ACCESS_REQUIRED</h2>
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 25px;">IDENTIFY_SESSION_TOKEN</p>
        <input type="password" id="adminToken" placeholder="ENTER_ADMIN_SECRET" onkeydown="if(event.key==='Enter') loadUsers()">
        <button onclick="loadUsers()" class="btn" style="width: 100%;">[ AUTHENTICATE ]</button>
    </div>

    <div id="adminSection" class="container" style="display: none;">
        <h1>ADMIN_NODE_MGR</h1>
        <div class="header-actions">
            <div style="font-size: 12px; color: var(--text-muted);">SYSTEM_LEVEL_0 :: TOTAL_NODES_ACTIVE</div>
            <button onclick="logout()" class="btn btn-status" style="font-size: 12px;">[ TERMINATE_SESSION ]</button>
        </div>
        
        <div style="overflow-x: auto;">
            <table id="userTable">
                <thead>
                    <tr>
                        <th>OPERATIVE_NAME</th>
                        <th>COMM_LINK_EMAIL</th>
                        <th>CREDITS</th>
                        <th>NODE_STATUS</th>
                        <th>OPERATIONS</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        let currentToken = '';

        function logout() {
            localStorage.removeItem('adminToken');
            location.reload();
        }

        async function loadUsers() {
            const tokenInput = document.getElementById('adminToken').value;
            const token = tokenInput || localStorage.getItem('adminToken');
            if (!token) return;

            const res = await fetch('/api/admin/users', {
                headers: { 'x-admin-token': token }
            });

            if (res.ok) {
                currentToken = token;
                localStorage.setItem('adminToken', token);
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminSection').style.display = 'block';
                
                const users = await res.json();
                const tbody = document.querySelector('#userTable tbody');
                tbody.innerHTML = '';
                
                users.forEach(user => {
                    const tr = document.createElement('tr');
                    const wallet = typeof user.wallet === 'number' ? user.wallet : 0;
                    tr.innerHTML = `
                        <td><strong>${user.name || 'ANONYMOUS'}</strong></td>
                        <td>${user.email || 'N/A'}</td>
                        <td style="color: var(--accent);">$${wallet.toFixed(2)}</td>
                        <td>
                            <span class="status-tag ${user.isActive ? 'status-active' : 'status-disabled'}">
                                ${user.isActive ? 'OPERATIONAL' : 'DEACTIVATED'}
                            </span>
                        </td>
                        <td>
                            <div style="display: flex; gap: 10px;">
                                <button class="btn" style="font-size: 10px; padding: 5px 10px;" onclick="updateBalance('${user.id}')">[ SET_CREDITS ]</button>
                                <button class="btn btn-status ${user.isActive ? 'active' : ''}" style="font-size: 10px; padding: 5px 10px;" onclick="toggleStatus('${user.id}')">
                                    [ ${user.isActive ? 'DEACTIVATE' : 'ACTIVATE'} ]
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                alert('!! ERROR: ACCESS_DENIED_INVALID_SECRET');
                localStorage.removeItem('adminToken');
            }
        }

        async function updateBalance(userId) {
            const amount = prompt("OVERRIDE_CREDIT_AMOUNT:");
            if (amount === null) return;
            
            const res = await fetch('/api/admin/update-balance', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-admin-token': currentToken
                },
                body: JSON.stringify({ userId, amount })
            });

            if (res.ok) loadUsers();
        }

        async function toggleStatus(userId) {
            const res = await fetch('/api/admin/toggle-status', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-admin-token': currentToken
                },
                body: JSON.stringify({ userId })
            });

            if (res.ok) loadUsers();
        }

        if (localStorage.getItem('adminToken')) {
            loadUsers();
        }
    </script>
</body>
</html>
