<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d1016">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Create your account · SaaS Proxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #0d1016;
            --bg-surface: #141821;
            --bg-elevated: #1b212c;
            --bg-input: #11151d;
            --border: #262d3a;
            --border-strong: #3a4456;
            --text-primary: #e6ecf3;
            --text-secondary: #b6c0cf;
            --text-muted: #8b95a8;
            --text-faint: #5d6779;
            --accent: #7be0a4;
            --accent-strong: #95e8bc;
            --accent-deep: #0d1016;
            --accent-bg: rgba(123, 224, 164, 0.10);
            --info: #7bd9ff;
            --info-bg: rgba(123, 217, 255, 0.10);
            --warning: #f0c074;
            --warning-bg: rgba(240, 192, 116, 0.10);
            --danger: #f07080;
            --danger-bg: rgba(240, 112, 128, 0.10);
            --shadow-md: 0 12px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02);
            --shadow-focus: 0 0 0 3px rgba(123, 224, 164, 0.20);
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            --font-sans: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: var(--font-sans);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            background:
              radial-gradient(1200px 700px at 50% -10%, rgba(123,224,164,0.06), transparent 60%),
              radial-gradient(900px 600px at 110% 110%, rgba(123,217,255,0.05), transparent 70%),
              var(--bg-canvas);
            background-attachment: fixed;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
              linear-gradient(rgba(255,255,255,0.014) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255,255,255,0.014) 1px, transparent 1px);
            background-size: 36px 36px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
        }

        .terminal-window {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            margin: 40px 0;
            animation: panel-in 360ms var(--ease-out);
        }

        @keyframes panel-in {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .title-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
        }
        .title-bar .prompt { color: var(--accent); font-weight: 700; }
        .title-bar .path { color: var(--text-secondary); }

        .dots { display: flex; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); }
        .dot:nth-child(1) { background: #f07080; opacity: 0.85; }
        .dot:nth-child(2) { background: #f0c074; opacity: 0.85; }
        .dot:nth-child(3) { background: #7be0a4; opacity: 0.85; }

        .terminal-content { padding: 28px 28px 24px; }

        h2 {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            margin: 4px 0 18px 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.10em;
        }

        .form-group { margin-bottom: 16px; position: relative; }

        label {
            display: block;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: border-color 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
        }
        .input-wrapper::before {
            content: "›";
            color: var(--accent);
            padding: 0 4px 0 12px;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 16px;
            user-select: none;
        }
        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: var(--shadow-focus);
        }

        input {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            padding: 11px 12px 11px 0;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 14px;
            outline: none;
        }
        input::placeholder { color: var(--text-faint); }

        .strength-meter {
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-mono);
        }
        .strength-bar { color: var(--text-muted); }
        .strength-text { text-transform: uppercase; letter-spacing: 0.06em; }

        button {
            width: 100%;
            background: var(--accent);
            color: var(--accent-deep);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 11px 16px;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.10em;
            cursor: pointer;
            margin-top: 18px;
            transition: filter 140ms var(--ease-out), box-shadow 140ms var(--ease-out), transform 100ms var(--ease-out);
        }
        button:hover { filter: brightness(1.04); box-shadow: var(--shadow-focus); }
        button:active { transform: translateY(1px); }
        button:focus-visible { outline: none; box-shadow: var(--shadow-focus); }

        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
        }
        .footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }
        .footer a:hover { text-decoration: underline; }

        #deployment-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(20, 24, 33, 0.94);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 14px;
            font-size: 13px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }
        .progress-bar {
            width: 240px;
            height: 4px;
            background: var(--bg-elevated);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            position: absolute;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-strong));
            transition: width 120ms linear;
        }

        .error-msg {
            color: var(--danger);
            font-size: 11px;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: none;
            font-family: var(--font-mono);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
        }

        @media (max-width: 720px) {
            body { padding: 16px; }
            .terminal-window { max-width: 100%; margin: 20px 0; }
            .terminal-content { padding: 24px 20px 20px; }
            input { font-size: 15px; }
            button { font-size: 13px; padding: 13px 16px; }
            #deployment-overlay { font-size: 12px; }
            .progress-bar { width: 100%; max-width: 240px; }
        }

        @media (max-width: 380px) {
            body { padding: 10px; }
            .terminal-content { padding: 20px 16px 16px; }
            .form-group { margin-bottom: 14px; }
            .input-wrapper::before { padding-left: 10px; font-size: 14px; }
            .footer { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="terminal-window">
        <div class="title-bar">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <span class="prompt">proxy</span><span class="path"> ~/create-account</span>
        </div>
        <div class="terminal-content">
            <div id="deployment-overlay">
                <div>DEPLOYING_IDENTITY_TO_GRID...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>
            <h2>REGISTER NEW OPERATIVE</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label>OPERATIVE_HANDLE</label>
                    <div class="input-wrapper">
                        <input type="text" id="name" required spellcheck="false" autocomplete="off" placeholder="display name">
                    </div>
                </div>
                <div class="form-group">
                    <label>COMMS_CHANNEL_EMAIL</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" required spellcheck="false" autocomplete="email" autocapitalize="off" inputmode="email" maxlength="120" placeholder="operative@example.com">
                    </div>
                    <div class="error-msg" id="email-error"></div>
                </div>
                <div class="form-group">
                    <label>CALLSIGN_USERNAME</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" required spellcheck="false" autocomplete="off" autocapitalize="off" minlength="3" maxlength="20" pattern="[a-z0-9]([a-z0-9._-]*[a-z0-9])?" placeholder="login handle">
                    </div>
                </div>
                <div class="form-group">
                    <label>ENCRYPTION_KEY_PASSWORD</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" required minlength="6" oninput="updateStrength(this.value)">
                    </div>
                    <div class="strength-meter" id="strength-meter" style="display: none;">
                        <span class="strength-bar" id="strength-bar">[□□□□□□□□]</span>
                        <span class="strength-text" id="strength-text">ENCRYPTION: NONE</span>
                    </div>
                </div>
                <button type="submit">[ DEPLOY_IDENTITY ]</button>
            </form>
            <div class="footer">
                ALREADY ENLISTED?<a href="/login">RETURN_TO_TERMINAL</a>
            </div>
        </div>
    </div>

    <script>
        // Themed in-app alert override. Replaces the native browser alert()
        // with an on-brand modal matching the design system. Must be loaded
        // before any page code that might call alert().
        (function () {
            if (window.__themedAlertInstalled) return;
            window.__themedAlertInstalled = true;

            var SVG_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 12 10 18 20 6"></polyline></svg>';
            var SVG_X     = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>';

            if (!document.getElementById('themed-alert-style')) {
                var css = '' +
                    '.ta-backdrop{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.72);' +
                    'display:flex;align-items:center;justify-content:center;' +
                    'backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);' +
                    'animation:ta-fade 140ms ease-out}' +
                    '.ta-card{min-width:320px;max-width:92vw;' +
                    'background:var(--bg-surface,#141821);' +
                    'border:1px solid rgba(255,255,255,0.08);border-radius:14px;' +
                    'padding:28px 26px 22px;text-align:center;' +
                    'color:var(--text,#e6e8ef);' +
                    'font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;' +
                    'box-shadow:0 24px 60px rgba(0,0,0,0.5);' +
                    'animation:ta-pop 200ms cubic-bezier(0.2,0.9,0.3,1.2)}' +
                    '.ta-icon{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;' +
                    'display:flex;align-items:center;justify-content:center;color:#fff}' +
                    '.ta-icon.ok{background:#1f9d55}' +
                    '.ta-icon.err{background:#d83a4a}' +
                    '.ta-icon svg{width:34px;height:34px;display:block}' +
                    '.ta-msg{white-space:pre-wrap;margin:0 0 18px;font-weight:600;letter-spacing:0.02em}' +
                    '.ta-btn{display:inline-block;min-width:96px;padding:9px 22px;border:0;' +
                    'border-radius:999px;background:#6c5ce7;color:#fff;' +
                    'font:600 13px/1 inherit;letter-spacing:0.06em;cursor:pointer;' +
                    'transition:transform 120ms ease,background 120ms ease}' +
                    '.ta-btn:hover{background:#5848d6;transform:translateY(-1px)}' +
                    '.ta-btn:active{transform:translateY(0)}' +
                    '@keyframes ta-fade{from{opacity:0}to{opacity:1}}' +
                    '@keyframes ta-pop{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}';
                var style = document.createElement('style');
                style.id = 'themed-alert-style';
                style.textContent = css;
                document.head.appendChild(style);
            }

            var backdrop = null;

            function kindFor(message) {
                if (typeof message !== 'string') return 'ok';
                // Codeset convention: errors are prefixed with "!!".
                return /^\s*!!/.test(message) ? 'err' : 'ok';
            }

            function show(message) {
                if (backdrop) { backdrop.remove(); backdrop = null; }

                var kind = kindFor(message);
                var iconSvg = kind === 'err' ? SVG_X : SVG_CHECK;

                backdrop = document.createElement('div');
                backdrop.className = 'ta-backdrop';
                backdrop.addEventListener('click', function (e) {
                    if (e.target === backdrop) close();
                });

                var card = document.createElement('div');
                card.className = 'ta-card';
                card.setAttribute('role', 'alertdialog');
                card.setAttribute('aria-modal', 'true');

                var icon = document.createElement('div');
                icon.className = 'ta-icon ' + kind;
                icon.innerHTML = iconSvg;

                var msg = document.createElement('div');
                msg.className = 'ta-msg';
                msg.textContent = message == null ? '' : String(message);

                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'ta-btn';
                btn.textContent = 'OK';

                function close() {
                    if (backdrop) {
                        backdrop.remove();
                        backdrop = null;
                    }
                    document.removeEventListener('keydown', onKey);
                }
                function onKey(e) {
                    if (e.key === 'Escape' || e.key === 'Enter') close();
                }
                btn.addEventListener('click', close);
                document.addEventListener('keydown', onKey);

                card.appendChild(icon);
                card.appendChild(msg);
                card.appendChild(btn);
                backdrop.appendChild(card);
                document.body.appendChild(backdrop);
                setTimeout(function () { btn.focus(); }, 0);
            }

            window.alert = show;
        })();
    </script>

    <script>
        function updateStrength(val) {
            const meter = document.getElementById('strength-meter');
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            
            if (!val) {
                meter.style.display = 'none';
                return;
            }
            meter.style.display = 'flex';
            
            let score = 0;
            if (val.length > 6) score++;
            if (val.length > 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            let bars = '';
            let label = '';
            let color = 'var(--text-muted)';

            if (score <= 2) {
                bars = '[■■□□□□□□]';
                label = 'ENCRYPTION: WEAK';
                color = 'var(--danger)';
            } else if (score <= 4) {
                bars = '[■■■■■□□□]';
                label = 'ENCRYPTION: MEDIUM';
                color = 'var(--warning)';
            } else {
                bars = '[■■■■■■■■]';
                label = 'ENCRYPTION: STRONG';
                color = 'var(--accent)';
            }

            bar.innerText = bars;
            text.innerText = label;
            text.style.color = color;
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const emailRaw = document.getElementById('email').value.trim();
            const usernameRaw = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            const emailError = document.getElementById('email-error');
            const basicEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!basicEmail.test(emailRaw)) {
                emailError.textContent = '!! INVALID_COMMS_FORMAT';
                emailError.style.display = 'block';
                return;
            }
            emailError.style.display = 'none';
            const email = emailRaw.toLowerCase();

            // Show deployment overlay
            const overlay = document.getElementById('deployment-overlay');
            const progress = document.getElementById('progress-fill');
            overlay.style.display = 'flex';

            let width = 0;
            const interval = setInterval(() => {
                width += Math.random() * 8;
                if (width >= 100) {
                    width = 100;
                    clearInterval(interval);
                }
                progress.style.width = width + '%';
            }, 50);

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, username: usernameRaw, password })
                });

                const data = await res.json();

                setTimeout(() => {
                    if (res.ok) {
                        const u = data && data.username ? ('\nCALLSIGN :: @' + data.username) : '';
                        alert('IDENTITY_DEPLOYED_SUCCESSFULLY. PROCEED_TO_TERMINAL.' + u);
                        window.location.href = '/login';
                    } else {
                        overlay.style.display = 'none';
                        alert("!! ERROR: " + (data.error || "IDENTITY_COMPROMISED"));
                    }
                }, 1000);
            } catch (err) {
                overlay.style.display = 'none';
                alert("!! ERROR: GRID_CONNECTION_INTERRUPTED");
            }
        });

        window.onerror = function(msg, url, line) {
            console.error("!! SYSTEM_ERROR: " + msg + " at " + line);
            return false;
        };
    </script>
    <a class="bot-fab" id="botFab" href="https://t.me/YourBot" target="_blank" rel="noopener noreferrer" aria-label="Open SaaS Proxy Bot on Telegram">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M21.198 2.433a2.242 2.242 0 0 0-2.252-.342c-.736.257-13.954 5.81-15.293 6.371-.585.246-.96.83-.945 1.452.014.622.42 1.183 1.018 1.4l3.685 1.32 1.443 4.65c.197.633.771.93 1.302.683l2.683-1.276 1.74 1.34c.196.155.45.235.715.235.139 0 .281-.026.418-.08.351-.13.59-.456.59-.83v-5.59l4.973-3.418c.6-.413.84-1.18.503-1.84zM9.91 13.838l-.395 3.992-2.621-3.732 9.446-5.3-6.43 5.04z"/></svg>
        <span>SaaS Proxy Bot</span>
    </a>
    <style>
        .bot-fab {
            position: fixed;
            right: 18px;
            bottom: 18px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px 10px 12px;
            background: #229ED9;
            color: #fff;
            border-radius: 999px;
            font: 700 12px/1 'JetBrains Mono', ui-monospace, monospace;
            text-decoration: none;
            letter-spacing: 0.04em;
            box-shadow: 0 8px 24px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.08);
            z-index: 9999;
            transition: transform 140ms ease, filter 140ms ease;
        }
        .bot-fab:hover { filter: brightness(1.08); transform: translateY(-1px); }
        .bot-fab:active { transform: translateY(0); }
        .bot-fab svg { display: block; }
        @media (max-width: 480px) {
            .bot-fab { right: 12px; bottom: 12px; padding: 9px 12px 9px 10px; font-size: 11px; }
        }
    </style>
    <script>
        (async function () {
            try {
                const res = await fetch('/api/bot-info');
                if (!res.ok) return;
                const data = await res.json();
                if (data && data.link) document.getElementById('botFab').href = data.link;
            } catch (_) { /* keep placeholder */ }
        })();
    </script>
</body>
</html>
