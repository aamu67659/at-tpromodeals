<!DOCTYPE html>
<html>
<head>
    <title>Create your account · SaaS Proxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #0d1016;
            --bg-surface: #141821;
            --bg-elevated: #1b212c;
            --bg-input: #11151d;
            --border: #262d3a;
            --border-strong: #3a4456;
            --text-primary: #e6ecf3;
            --text-secondary: #b6c0cf;
            --text-muted: #8b95a8;
            --text-faint: #5d6779;
            --accent: #7be0a4;
            --accent-strong: #95e8bc;
            --accent-deep: #0d1016;
            --accent-bg: rgba(123, 224, 164, 0.10);
            --info: #7bd9ff;
            --info-bg: rgba(123, 217, 255, 0.10);
            --warning: #f0c074;
            --warning-bg: rgba(240, 192, 116, 0.10);
            --danger: #f07080;
            --danger-bg: rgba(240, 112, 128, 0.10);
            --shadow-md: 0 12px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02);
            --shadow-focus: 0 0 0 3px rgba(123, 224, 164, 0.20);
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            --font-sans: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: var(--font-sans);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            background:
              radial-gradient(1200px 700px at 50% -10%, rgba(123,224,164,0.06), transparent 60%),
              radial-gradient(900px 600px at 110% 110%, rgba(123,217,255,0.05), transparent 70%),
              var(--bg-canvas);
            background-attachment: fixed;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
              linear-gradient(rgba(255,255,255,0.014) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255,255,255,0.014) 1px, transparent 1px);
            background-size: 36px 36px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
        }

        .terminal-window {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            margin: 40px 0;
            animation: panel-in 360ms var(--ease-out);
        }

        @keyframes panel-in {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .title-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
        }
        .title-bar .prompt { color: var(--accent); font-weight: 700; }
        .title-bar .path { color: var(--text-secondary); }

        .dots { display: flex; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); }
        .dot:nth-child(1) { background: #f07080; opacity: 0.85; }
        .dot:nth-child(2) { background: #f0c074; opacity: 0.85; }
        .dot:nth-child(3) { background: #7be0a4; opacity: 0.85; }

        .terminal-content { padding: 28px 28px 24px; }

        h2 {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            margin: 4px 0 18px 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.10em;
        }

        .form-group { margin-bottom: 16px; position: relative; }

        label {
            display: block;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: border-color 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
        }
        .input-wrapper::before {
            content: "›";
            color: var(--accent);
            padding: 0 4px 0 12px;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 16px;
            user-select: none;
        }
        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: var(--shadow-focus);
        }

        input {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            padding: 11px 12px 11px 0;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 14px;
            outline: none;
        }
        input::placeholder { color: var(--text-faint); }

        .strength-meter {
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-mono);
        }
        .strength-bar { color: var(--text-muted); }
        .strength-text { text-transform: uppercase; letter-spacing: 0.06em; }

        button {
            width: 100%;
            background: var(--accent);
            color: var(--accent-deep);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 11px 16px;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.10em;
            cursor: pointer;
            margin-top: 18px;
            transition: filter 140ms var(--ease-out), box-shadow 140ms var(--ease-out), transform 100ms var(--ease-out);
        }
        button:hover { filter: brightness(1.04); box-shadow: var(--shadow-focus); }
        button:active { transform: translateY(1px); }
        button:focus-visible { outline: none; box-shadow: var(--shadow-focus); }

        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
        }
        .footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }
        .footer a:hover { text-decoration: underline; }

        #deployment-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(20, 24, 33, 0.94);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 14px;
            font-size: 13px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }
        .progress-bar {
            width: 240px;
            height: 4px;
            background: var(--bg-elevated);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            position: absolute;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-strong));
            transition: width 120ms linear;
        }

        .error-msg {
            color: var(--danger);
            font-size: 11px;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: none;
            font-family: var(--font-mono);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
        }
    </style>
</head>
<body>
    <div class="terminal-window">
        <div class="title-bar">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <span class="prompt">proxy</span><span class="path"> ~/create-account</span>
        </div>
        <div class="terminal-content">
            <div id="deployment-overlay">
                <div>DEPLOYING_IDENTITY_TO_GRID...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>
            <h2>REGISTER NEW OPERATIVE</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label>OPERATIVE_HANDLE</label>
                    <div class="input-wrapper">
                        <input type="text" id="name" required spellcheck="false" autocomplete="off" placeholder="full name">
                    </div>
                </div>
                <div class="form-group">
                    <label>COMM_LINK_EMAIL</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" required spellcheck="false" autocomplete="off" placeholder="email@address.net">
                    </div>
                </div>
                <div class="form-group">
                    <label>TELEGRAM_UPLINK</label>
                    <div class="input-wrapper">
                        <input type="text" id="telegram" required spellcheck="false" autocomplete="off" placeholder="@username">
                    </div>
                </div>
                <div class="form-group">
                    <label>ENCRYPTION_KEY_PASSWORD</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" required oninput="updateStrength(this.value)">
                    </div>
                    <div class="strength-meter" id="strength-meter" style="display: none;">
                        <span class="strength-bar" id="strength-bar">[□□□□□□□□]</span>
                        <span class="strength-text" id="strength-text">ENCRYPTION: NONE</span>
                    </div>
                </div>
                <button type="submit">[ DEPLOY_IDENTITY ]</button>
            </form>
            <div class="footer">
                ALREADY ENLISTED?<a href="/login">RETURN_TO_TERMINAL</a>
            </div>
        </div>
    </div>

    <script>
        function updateStrength(val) {
            const meter = document.getElementById('strength-meter');
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            
            if (!val) {
                meter.style.display = 'none';
                return;
            }
            meter.style.display = 'flex';
            
            let score = 0;
            if (val.length > 6) score++;
            if (val.length > 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            let bars = '';
            let label = '';
            let color = 'var(--text-muted)';

            if (score <= 2) {
                bars = '[■■□□□□□□]';
                label = 'ENCRYPTION: WEAK';
                color = 'var(--danger)';
            } else if (score <= 4) {
                bars = '[■■■■■□□□]';
                label = 'ENCRYPTION: MEDIUM';
                color = 'var(--warning)';
            } else {
                bars = '[■■■■■■■■]';
                label = 'ENCRYPTION: STRONG';
                color = 'var(--accent)';
            }

            bar.innerText = bars;
            text.innerText = label;
            text.style.color = color;
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const telegram = document.getElementById('telegram').value;
            const password = document.getElementById('password').value;

            // Show deployment overlay
            const overlay = document.getElementById('deployment-overlay');
            const progress = document.getElementById('progress-fill');
            overlay.style.display = 'flex';
            
            let width = 0;
            const interval = setInterval(() => {
                width += Math.random() * 8;
                if (width >= 100) {
                    width = 100;
                    clearInterval(interval);
                }
                progress.style.width = width + '%';
            }, 50);

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, telegram, password })
                });

                const data = await res.json();
                
                setTimeout(() => {
                    if (res.ok) {
                        alert('IDENTITY_DEPLOYED_SUCCESSFULLY. PROCEED_TO_TERMINAL.');
                        window.location.href = '/login';
                    } else {
                        overlay.style.display = 'none';
                        alert("!! ERROR: " + (data.error || "IDENTITY_COMPROMISED"));
                    }
                }, 1000);
            } catch (err) {
                overlay.style.display = 'none';
                alert("!! ERROR: GRID_CONNECTION_INTERRUPTED");
            }
        });

        window.onerror = function(msg, url, line) {
            console.error("!! SYSTEM_ERROR: " + msg + " at " + line);
            return false;
        };
    </script>
</body>
</html>
