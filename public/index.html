<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>SaaS Proxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #0d1016;
            --bg-elevated: #1b212c;
            --border: #262d3a;
            --text-primary: #e6ecf3;
            --text-muted: #8b95a8;
            --text-faint: #5d6779;
            --accent: #7be0a4;
            --accent-bg: rgba(123, 224, 164, 0.10);
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            --font-sans: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            background:
              radial-gradient(900px 600px at 50% -10%, rgba(123,224,164,0.06), transparent 60%),
              var(--bg-canvas);
            color: var(--text-primary);
            font-family: var(--font-sans);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            gap: 18px;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
              linear-gradient(rgba(255,255,255,0.014) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255,255,255,0.014) 1px, transparent 1px);
            background-size: 36px 36px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
        }
        .loader-mark {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.10em;
            text-transform: uppercase;
        }
        .loader-mark .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.35; transform: scale(0.85); }
        }
    </style>
</head>
<body>
    <div class="loader-mark"><span class="dot"></span> Loading SaaS Proxy…</div>
    <script>
        window.location.href = '/login.html';
    </script>
    <a class="bot-fab" id="botFab" href="https://t.me/YourBot" target="_blank" rel="noopener noreferrer" aria-label="Open SaaS Proxy Bot on Telegram">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M21.198 2.433a2.242 2.242 0 0 0-2.252-.342c-.736.257-13.954 5.81-15.293 6.371-.585.246-.96.83-.945 1.452.014.622.42 1.183 1.018 1.4l3.685 1.32 1.443 4.65c.197.633.771.93 1.302.683l2.683-1.276 1.74 1.34c.196.155.45.235.715.235.139 0 .281-.026.418-.08.351-.13.59-.456.59-.83v-5.59l4.973-3.418c.6-.413.84-1.18.503-1.84zM9.91 13.838l-.395 3.992-2.621-3.732 9.446-5.3-6.43 5.04z"/></svg>
        <span>SaaS Proxy Bot</span>
    </a>
    <style>
        .bot-fab {
            position: fixed;
            right: 18px;
            bottom: 18px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px 10px 12px;
            background: #229ED9;
            color: #fff;
            border-radius: 999px;
            font: 700 12px/1 'JetBrains Mono', ui-monospace, monospace;
            text-decoration: none;
            letter-spacing: 0.04em;
            box-shadow: 0 8px 24px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.08);
            z-index: 9999;
            transition: transform 140ms ease, filter 140ms ease;
        }
        .bot-fab:hover { filter: brightness(1.08); transform: translateY(-1px); }
        .bot-fab:active { transform: translateY(0); }
        .bot-fab svg { display: block; }
        @media (max-width: 480px) {
            .bot-fab { right: 12px; bottom: 12px; padding: 9px 12px 9px 10px; font-size: 11px; }
        }
    </style>
    <script>
        (async function () {
            try {
                const res = await fetch('/api/bot-info');
                if (!res.ok) return;
                const data = await res.json();
                if (data && data.link) document.getElementById('botFab').href = data.link;
            } catch (_) { /* keep placeholder */ }
        })();
    </script>
</body>
</html>
