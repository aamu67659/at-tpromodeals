<!DOCTYPE html>
<html>
<head>
    <title>ACCESS TERMINAL - SaaS Proxy</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0e0a;
            --bg-surface: #0f150f;
            --bg-elevated: #141b14;
            --border: #1c2b1c;
            --text-primary: #d6ffd6;
            --text-muted: #5f8f5f;
            --accent: #00ff66;
            --accent-dim: #00b34a;
            --danger: #ff2d55;
            --warning: #ffb000;
            --glow: 0 0 8px rgba(0,255,102,0.6);
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* Scanline Overlay */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* CRT Vignette */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, rgba(10, 14, 10, 0) 60%, rgba(0, 0, 0, 0.8) 100%);
            z-index: 3;
            pointer-events: none;
        }

        .terminal-window {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 10;
            box-shadow: var(--glow);
        }

        .title-bar {
            background: var(--bg-elevated);
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .dots {
            display: flex;
            gap: 6px;
            margin-right: 12px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
        }

        .terminal-content {
            padding: 30px;
        }

        h2 {
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0 0 30px 0;
            color: var(--accent);
            text-shadow: var(--glow);
            text-align: left;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper::before {
            content: ">";
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: bold;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            padding: 8px 8px 8px 20px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-bottom: 1px solid var(--accent);
        }

        button {
            width: 100%;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background: var(--accent);
            color: var(--bg-base);
            box-shadow: var(--glow);
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
            margin-left: 5px;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Decrypting overlay */
        #loading-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-surface);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 14px;
        }

        .progress-bar {
            width: 200px;
            height: 4px;
            background: var(--bg-elevated);
            margin-top: 15px;
            position: relative;
        }

        .progress-fill {
            position: absolute;
            height: 100%;
            background: var(--accent);
            box-shadow: var(--glow);
            width: 0%;
            transition: width 0.1s;
        }

        /* Typewriter Cursor */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--accent);
            margin-left: 5px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }

        .recover-msg {
            margin-top: 12px;
            padding: 8px 10px;
            font-size: 11px;
            border: 1px solid var(--border);
            display: none;
        }
        .recover-msg.error { display: block; color: var(--danger); border-color: var(--danger); }
        .recover-msg.success { display: block; color: var(--accent); border-color: var(--accent); }
    </style>
</head>
<body>
    <div class="terminal-window">
        <div class="title-bar">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <span>root@darknet:~$ ./login</span>
        </div>
        <div class="terminal-content">
            <div id="loading-overlay">
                <div>DECRYPTING_CREDENTIALS...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>
            <h2>ACCESS TERMINAL</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>ENTER_EMAIL</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" required spellcheck="false" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>ENTER_PASSWORD</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" required>
                    </div>
                </div>
                <button type="submit">[ AUTHENTICATE ]</button>
            </form>
            <div class="footer recover-footer">
                FORGOT PASSWORD?<a href="#" id="forgotLink">RESET_WITH_PIN</a>
            </div>

            <form id="forgotForm" style="display: none;">
                <div class="form-group">
                    <label>REGISTERED_EMAIL</label>
                    <div class="input-wrapper">
                        <input type="email" id="forgotEmail" required spellcheck="false" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>RECOVERY_PIN (4 DIGITS)</label>
                    <div class="input-wrapper">
                        <input type="password" id="forgotPin" inputmode="numeric" pattern="\d{4}" maxlength="4" required autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>NEW_PASSWORD</label>
                    <div class="input-wrapper">
                        <input type="password" id="forgotNewPassword" required minlength="6" autocomplete="new-password">
                    </div>
                </div>
                <div class="form-group">
                    <label>CONFIRM_NEW_PASSWORD</label>
                    <div class="input-wrapper">
                        <input type="password" id="forgotConfirmPassword" required minlength="6" autocomplete="new-password">
                    </div>
                </div>
                <button type="submit">[ RESET_PASSWORD ]</button>
                <div class="footer recover-footer">
                    <a href="#" id="forgotBack">&lt;&lt; BACK_TO_LOGIN</a>
                </div>
                <div id="forgotMsg" class="recover-msg"></div>
            </form>

            <div class="footer">
                NEW OPERATIVE?<a href="/signup">REGISTER_IDENTITY</a>
            </div>
        </div>
    </div>

    <script>
        // Redirect if already logged in
        async function checkAuth() {
            const res = await fetch('/api/user');
            if (res.ok) window.location.href = '/dashboard.html';
        }
        checkAuth();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Show loading overlay
            const overlay = document.getElementById('loading-overlay');
            const progress = document.getElementById('progress-fill');
            overlay.style.display = 'flex';

            let width = 0;
            const interval = setInterval(() => {
                width += Math.random() * 10;
                if (width >= 100) {
                    width = 100;
                    clearInterval(interval);
                }
                progress.style.width = width + '%';
            }, 50);

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                // Add a small delay for dramatic effect
                setTimeout(() => {
                    if (res.ok) {
                        window.location.href = '/dashboard.html';
                    } else {
                        overlay.style.display = 'none';
                        alert("!! ERROR: " + (data.error || "AUTHENTICATION_FAILED"));
                    }
                }, 800);
            } catch (err) {
                overlay.style.display = 'none';
                alert("!! ERROR: CONNECTION_LOST");
            }
        });

        document.getElementById('forgotLink').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = '';
            document.querySelector('.recover-footer').style.display = 'none';
            document.getElementById('forgotMsg').innerText = '';
        });

        document.getElementById('forgotBack').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('loginForm').style.display = '';
            document.getElementById('forgotForm').style.display = 'none';
            document.querySelector('.recover-footer').style.display = '';
            document.getElementById('forgotMsg').innerText = '';
        });

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim();
            const pin = document.getElementById('forgotPin').value.trim();
            const newPassword = document.getElementById('forgotNewPassword').value;
            const confirmPassword = document.getElementById('forgotConfirmPassword').value;
            const msgEl = document.getElementById('forgotMsg');

            msgEl.className = 'recover-msg';
            msgEl.innerText = '';

            if (newPassword !== confirmPassword) {
                msgEl.classList.add('error');
                msgEl.innerText = '!! Passwords do not match.';
                return;
            }

            try {
                const res = await fetch('/api/forgot/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, pin, newPassword })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    msgEl.classList.add('success');
                    msgEl.innerText = '> ' + (data.message || 'Password reset.') + ' Returning to login...';
                    setTimeout(() => {
                        document.getElementById('forgotForm').style.display = 'none';
                        document.getElementById('loginForm').style.display = '';
                        document.querySelector('.recover-footer').style.display = '';
                        document.getElementById('forgotForm').reset();
                        msgEl.innerText = '';
                    }, 1800);
                } else {
                    msgEl.classList.add('error');
                    msgEl.innerText = '!! ERROR: ' + (data.error || 'RESET_FAILED');
                }
            } catch (err) {
                msgEl.classList.add('error');
                msgEl.innerText = '!! CONNECTION_LOST: ' + err.message;
            }
        });

        // Error handling
        window.onerror = function(msg, url, line) {
            console.error("!! SYSTEM_ERROR: " + msg + " at " + line);
            return false;
        };
    </script>
</body>
</html>
