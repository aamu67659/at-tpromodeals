<!DOCTYPE html>
<html>
<head>
    <title>Sign in · SaaS Proxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #0d1016;
            --bg-surface: #141821;
            --bg-elevated: #1b212c;
            --bg-input: #11151d;
            --border: #262d3a;
            --border-strong: #3a4456;
            --text-primary: #e6ecf3;
            --text-secondary: #b6c0cf;
            --text-muted: #8b95a8;
            --text-faint: #5d6779;
            --accent: #7be0a4;
            --accent-strong: #95e8bc;
            --accent-deep: #0d1016;
            --accent-bg: rgba(123, 224, 164, 0.10);
            --accent-border: rgba(123, 224, 164, 0.32);
            --info: #7bd9ff;
            --info-bg: rgba(123, 217, 255, 0.10);
            --warning: #f0c074;
            --warning-bg: rgba(240, 192, 116, 0.10);
            --danger: #f07080;
            --danger-bg: rgba(240, 112, 128, 0.10);
            --shadow-md: 0 12px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02);
            --shadow-focus: 0 0 0 3px rgba(123, 224, 164, 0.20);
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            --font-sans: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: var(--font-sans);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            background:
              radial-gradient(1200px 700px at 50% -10%, rgba(123,224,164,0.06), transparent 60%),
              radial-gradient(900px 600px at 110% 110%, rgba(123,217,255,0.05), transparent 70%),
              var(--bg-canvas);
            background-attachment: fixed;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
              linear-gradient(rgba(255,255,255,0.014) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255,255,255,0.014) 1px, transparent 1px);
            background-size: 36px 36px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
        }

        .terminal-window {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            animation: panel-in 360ms var(--ease-out);
        }

        @keyframes panel-in {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .title-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
        }

        .dots { display: flex; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); }
        .dot:nth-child(1) { background: #f07080; opacity: 0.85; }
        .dot:nth-child(2) { background: #f0c074; opacity: 0.85; }
        .dot:nth-child(3) { background: #7be0a4; opacity: 0.85; }

        .title-bar .prompt { color: var(--accent); font-weight: 700; }
        .title-bar .path { color: var(--text-secondary); }

        .terminal-content { padding: 28px 28px 24px; }

        h2 {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            margin: 4px 0 18px 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.10em;
        }

        .form-group { margin-bottom: 16px; position: relative; }

        label {
            display: block;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: border-color 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
        }
        .input-wrapper::before {
            content: "›";
            color: var(--accent);
            padding: 0 4px 0 12px;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 16px;
            user-select: none;
        }
        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: var(--shadow-focus);
        }
        .input-wrapper::after {
            content: "";
            display: none;
            width: 2px;
            height: 16px;
            margin-right: 12px;
            background: var(--accent);
            animation: blink 1.05s step-end infinite;
        }
        .input-wrapper:focus-within::after { display: inline-block; }

        input {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            padding: 11px 12px 11px 0;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 14px;
            outline: none;
        }
        input::placeholder { color: var(--text-faint); }

        button {
            width: 100%;
            background: var(--accent);
            color: var(--accent-deep);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 11px 16px;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.10em;
            cursor: pointer;
            margin-top: 8px;
            transition: filter 140ms var(--ease-out), box-shadow 140ms var(--ease-out), transform 100ms var(--ease-out);
        }
        button:hover { filter: brightness(1.04); box-shadow: var(--shadow-focus); }
        button:active { transform: translateY(1px); }
        button:focus-visible { outline: none; box-shadow: var(--shadow-focus); }

        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
        }
        .footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .footer a:hover { text-decoration: underline; }

        #loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(20, 24, 33, 0.94);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 14px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        #loading-overlay .label-row {
            display: flex; align-items: center; gap: 10px;
            font-family: var(--font-mono);
            letter-spacing: 0.05em;
        }
        .pulse-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent);
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.4; transform: scale(0.85); }
        }

        .progress-bar {
            width: 220px;
            height: 4px;
            background: var(--bg-elevated);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            position: absolute;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-strong));
            transition: width 120ms linear;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background: var(--accent);
            margin-left: 4px;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            from, to { opacity: 1; }
            50%      { opacity: 0; }
        }

        .recover-msg {
            margin-top: 12px;
            padding: 8px 12px;
            font-size: 12px;
            font-family: var(--font-mono);
            border: 1px solid var(--border);
            border-radius: 6px;
            display: none;
        }
        .recover-msg.error   { display: block; color: var(--danger);  border-color: rgba(240,112,128,0.4); background: var(--danger-bg); }
        .recover-msg.success { display: block; color: var(--accent);  border-color: rgba(123,224,164,0.4); background: var(--accent-bg); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
        }
    </style>
</head>
<body>
    <div class="terminal-window">
        <div class="title-bar">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <span class="prompt">proxy</span><span class="path"> ~/login</span>
        </div>
        <div class="terminal-content">
            <div id="loading-overlay">
                <div>DECRYPTING_CREDENTIALS...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>
            <h2>ACCESS TERMINAL</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>ENTER_EMAIL</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" required spellcheck="false" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>ENTER_PASSWORD</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" required>
                    </div>
                </div>
                <button type="submit">[ AUTHENTICATE ]</button>
            </form>
            <div class="footer recover-footer">
                FORGOT PASSWORD?<a href="#" id="forgotLink">RESET_WITH_PIN</a>
            </div>

            <form id="forgotForm" style="display: none;">
                <div class="form-group">
                    <label>REGISTERED_EMAIL</label>
                    <div class="input-wrapper">
                        <input type="email" id="forgotEmail" required spellcheck="false" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>RECOVERY_PIN (4 DIGITS)</label>
                    <div class="input-wrapper">
                        <input type="password" id="forgotPin" inputmode="numeric" pattern="\d{4}" maxlength="4" required autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>NEW_PASSWORD</label>
                    <div class="input-wrapper">
                        <input type="password" id="forgotNewPassword" required minlength="6" autocomplete="new-password">
                    </div>
                </div>
                <div class="form-group">
                    <label>CONFIRM_NEW_PASSWORD</label>
                    <div class="input-wrapper">
                        <input type="password" id="forgotConfirmPassword" required minlength="6" autocomplete="new-password">
                    </div>
                </div>
                <button type="submit">[ RESET_PASSWORD ]</button>
                <div class="footer recover-footer">
                    <a href="#" id="forgotBack">&lt;&lt; BACK_TO_LOGIN</a>
                </div>
                <div id="forgotMsg" class="recover-msg"></div>
            </form>

            <div class="footer">
                NEW OPERATIVE?<a href="/signup">REGISTER_IDENTITY</a>
            </div>
        </div>
    </div>

    <script>
        // Themed in-app alert override. Replaces the native browser alert()
        // with an on-brand modal matching the design system. Must be loaded
        // before any page code that might call alert().
        (function () {
            if (window.__themedAlertInstalled) return;
            window.__themedAlertInstalled = true;

            var SVG_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 12 10 18 20 6"></polyline></svg>';
            var SVG_X     = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>';

            if (!document.getElementById('themed-alert-style')) {
                var css = '' +
                    '.ta-backdrop{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.72);' +
                    'display:flex;align-items:center;justify-content:center;' +
                    'backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);' +
                    'animation:ta-fade 140ms ease-out}' +
                    '.ta-card{min-width:320px;max-width:92vw;' +
                    'background:var(--bg-surface,#141821);' +
                    'border:1px solid rgba(255,255,255,0.08);border-radius:14px;' +
                    'padding:28px 26px 22px;text-align:center;' +
                    'color:var(--text,#e6e8ef);' +
                    'font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;' +
                    'box-shadow:0 24px 60px rgba(0,0,0,0.5);' +
                    'animation:ta-pop 200ms cubic-bezier(0.2,0.9,0.3,1.2)}' +
                    '.ta-icon{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;' +
                    'display:flex;align-items:center;justify-content:center;color:#fff}' +
                    '.ta-icon.ok{background:#1f9d55}' +
                    '.ta-icon.err{background:#d83a4a}' +
                    '.ta-icon svg{width:34px;height:34px;display:block}' +
                    '.ta-msg{white-space:pre-wrap;margin:0 0 18px;font-weight:600;letter-spacing:0.02em}' +
                    '.ta-btn{display:inline-block;min-width:96px;padding:9px 22px;border:0;' +
                    'border-radius:999px;background:#6c5ce7;color:#fff;' +
                    'font:600 13px/1 inherit;letter-spacing:0.06em;cursor:pointer;' +
                    'transition:transform 120ms ease,background 120ms ease}' +
                    '.ta-btn:hover{background:#5848d6;transform:translateY(-1px)}' +
                    '.ta-btn:active{transform:translateY(0)}' +
                    '@keyframes ta-fade{from{opacity:0}to{opacity:1}}' +
                    '@keyframes ta-pop{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}';
                var style = document.createElement('style');
                style.id = 'themed-alert-style';
                style.textContent = css;
                document.head.appendChild(style);
            }

            var backdrop = null;

            function kindFor(message) {
                if (typeof message !== 'string') return 'ok';
                // Codeset convention: errors are prefixed with "!!".
                return /^\s*!!/.test(message) ? 'err' : 'ok';
            }

            function show(message) {
                if (backdrop) { backdrop.remove(); backdrop = null; }

                var kind = kindFor(message);
                var iconSvg = kind === 'err' ? SVG_X : SVG_CHECK;

                backdrop = document.createElement('div');
                backdrop.className = 'ta-backdrop';
                backdrop.addEventListener('click', function (e) {
                    if (e.target === backdrop) close();
                });

                var card = document.createElement('div');
                card.className = 'ta-card';
                card.setAttribute('role', 'alertdialog');
                card.setAttribute('aria-modal', 'true');

                var icon = document.createElement('div');
                icon.className = 'ta-icon ' + kind;
                icon.innerHTML = iconSvg;

                var msg = document.createElement('div');
                msg.className = 'ta-msg';
                msg.textContent = message == null ? '' : String(message);

                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'ta-btn';
                btn.textContent = 'OK';

                function close() {
                    if (backdrop) {
                        backdrop.remove();
                        backdrop = null;
                    }
                    document.removeEventListener('keydown', onKey);
                }
                function onKey(e) {
                    if (e.key === 'Escape' || e.key === 'Enter') close();
                }
                btn.addEventListener('click', close);
                document.addEventListener('keydown', onKey);

                card.appendChild(icon);
                card.appendChild(msg);
                card.appendChild(btn);
                backdrop.appendChild(card);
                document.body.appendChild(backdrop);
                setTimeout(function () { btn.focus(); }, 0);
            }

            window.alert = show;
        })();
    </script>

    <script>
        // Redirect if already logged in
        async function checkAuth() {
            const res = await fetch('/api/user');
            if (res.ok) window.location.href = '/dashboard.html';
        }
        checkAuth();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Show loading overlay
            const overlay = document.getElementById('loading-overlay');
            const progress = document.getElementById('progress-fill');
            overlay.style.display = 'flex';

            let width = 0;
            const interval = setInterval(() => {
                width += Math.random() * 10;
                if (width >= 100) {
                    width = 100;
                    clearInterval(interval);
                }
                progress.style.width = width + '%';
            }, 50);

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                // Add a small delay for dramatic effect
                setTimeout(() => {
                    if (res.ok) {
                        window.location.href = '/dashboard.html';
                    } else {
                        overlay.style.display = 'none';
                        alert("!! ERROR: " + (data.error || "AUTHENTICATION_FAILED"));
                    }
                }, 800);
            } catch (err) {
                overlay.style.display = 'none';
                alert("!! ERROR: CONNECTION_LOST");
            }
        });

        document.getElementById('forgotLink').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = '';
            document.querySelector('.recover-footer').style.display = 'none';
            document.getElementById('forgotMsg').innerText = '';
        });

        document.getElementById('forgotBack').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('loginForm').style.display = '';
            document.getElementById('forgotForm').style.display = 'none';
            document.querySelector('.recover-footer').style.display = '';
            document.getElementById('forgotMsg').innerText = '';
        });

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim();
            const pin = document.getElementById('forgotPin').value.trim();
            const newPassword = document.getElementById('forgotNewPassword').value;
            const confirmPassword = document.getElementById('forgotConfirmPassword').value;
            const msgEl = document.getElementById('forgotMsg');

            msgEl.className = 'recover-msg';
            msgEl.innerText = '';

            if (newPassword !== confirmPassword) {
                msgEl.classList.add('error');
                msgEl.innerText = '!! Passwords do not match.';
                return;
            }

            try {
                const res = await fetch('/api/forgot/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, pin, newPassword })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    msgEl.classList.add('success');
                    msgEl.innerText = '> ' + (data.message || 'Password reset.') + ' Returning to login...';
                    setTimeout(() => {
                        document.getElementById('forgotForm').style.display = 'none';
                        document.getElementById('loginForm').style.display = '';
                        document.querySelector('.recover-footer').style.display = '';
                        document.getElementById('forgotForm').reset();
                        msgEl.innerText = '';
                    }, 1800);
                } else {
                    msgEl.classList.add('error');
                    msgEl.innerText = '!! ERROR: ' + (data.error || 'RESET_FAILED');
                }
            } catch (err) {
                msgEl.classList.add('error');
                msgEl.innerText = '!! CONNECTION_LOST: ' + err.message;
            }
        });

        // Error handling
        window.onerror = function(msg, url, line) {
            console.error("!! SYSTEM_ERROR: " + msg + " at " + line);
            return false;
        };
    </script>
</body>
</html>
